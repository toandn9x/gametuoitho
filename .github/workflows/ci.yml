name: CI Test & Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint Monorepo
        run: pnpm lint

      - name: Run Automated API Tests
        run: pnpm test

      - name: Build API Application
        run: pnpm --filter @gametuoitho/api build

      - name: Build Web Application
        run: pnpm --filter @gametuoitho/web build

      - name: Run PM Asset Review
        run: pnpm --filter @gametuoitho/api exec tsx ../../tests/pm/asset-review.ts

      - name: Run PM Admin Render Review
        run: node tests/pm/admin-render-review.cjs
