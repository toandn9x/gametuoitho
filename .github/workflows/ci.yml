name: CI Test & Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install Dependencies
        run: |
          pnpm approve-builds --all || true
          pnpm install

      - name: Typecheck Packages
        run: |
          pnpm --filter "@gametuoitho/shared-types" build
          pnpm --filter "@gametuoitho/api-contracts" build
          pnpm --filter "@gametuoitho/shared-utils" build
          pnpm --filter "@gametuoitho/api" build

      - name: Run Automated API Tests
        run: |
          pnpm --filter @gametuoitho/api exec tsx ../../tests/api.test.ts

      - name: Build Web Application
        run: |
          pnpm --filter @gametuoitho/web build
